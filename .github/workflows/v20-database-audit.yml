name: V2 disposable PostgreSQL audit (no production access)
on:
  push:
    branches: [v20-research-audit-20261117]
    paths:
      - 'database-audit/**'
      - '.github/workflows/v20-database-audit.yml'
      - 'v17-common/server.mjs'
      - 'research-v2/schema.sql'
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research_only
          POSTGRES_DB: research_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      V17_NO_LISTEN: '1'
      RESEARCH_TEST_DATABASE_URL: postgresql://research:research_only@localhost:5432/research_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix v17-common --ignore-scripts --no-audit --no-fund
      - run: node --test database-audit/*.test.mjs
