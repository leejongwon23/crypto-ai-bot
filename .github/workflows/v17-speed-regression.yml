name: V1.7 speed optimization regression
on:
  push:
    branches: [v17-performance-opt-20261113]
  pull_request:
    branches: [v17-canonical-engine]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      V17_NO_LISTEN: '1'
    defaults:
      run:
        working-directory: v17-common
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install service dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check of all edited modules
        run: |
          node --check server.mjs
          node --check cached-policy-response.mjs
          node --check cached-policy-response.test.mjs
          node --check server-fast-integration.test.mjs
          node --check price-path-recovery.mjs
          node --check official-price-tracker.mjs
          node --check price-path-recovery.test.mjs
          node --check official-price-tracker.test.mjs
      - name: Run all V1.7 existing and performance tests
        run: npm test
      - name: Read-only public Bybit 1m connectivity probe (diagnostic)
        run: |
          node --input-type=module -e "const ac=new AbortController(); const t=setTimeout(()=>ac.abort(),5000); try{const u=new URL('https://api.bybit.com/v5/market/kline');for(const [k,v] of Object.entries({category:'linear',symbol:'ETHUSDT',interval:'1',limit:'2'}))u.searchParams.set(k,v);const r=await fetch(u,{signal:ac.signal});const x=await r.json().catch(()=>({}));console.log('BYBIT_PUBLIC_PROBE HTTP',r.status,'retCode',x.retCode,'count',x.result?.list?.length??0)}catch(e){console.log('BYBIT_PUBLIC_PROBE ERROR',String(e.message||e))}finally{clearTimeout(t)}"


      - name: Probe provider-owned Bybit fallback domains (diagnostic)
        run: |
          node --input-type=module -e "for(const host of ['api.bytick.com','api.bybit.nl','api.bybit.com']){const ac=new AbortController();const t=setTimeout(()=>ac.abort(),3000);try{const u='https://'+host+'/v5/market/kline?category=linear&symbol=ETHUSDT&interval=1&limit=2';const r=await fetch(u,{signal:ac.signal});const x=await r.json().catch(()=>({}));console.log('BYBIT_DOMAIN_PROBE',host,'HTTP',r.status,'retCode',x.retCode,'items',x.result?.list?.length??0)}catch(e){console.log('BYBIT_DOMAIN_PROBE',host,'ERROR',String(e.message||e))}finally{clearTimeout(t)}}"
